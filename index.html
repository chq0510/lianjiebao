
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>链接宝 · 纯净可用版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2em;
        }
        h1 {
            margin-bottom: 1em;
            font-size: 1.6em;
        }
        textarea {
            width: 100%;
            max-width: 500px;
            min-height: 120px;
            padding: 1em;
            border-radius: 10px;
            border: none;
            font-size: 1em;
            background-color: #1e1e1e;
            color: #fff;
            resize: vertical;
        }
        button {
            margin-top: 1em;
            padding: 0.75em 2em;
            font-size: 1.1em;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #43a047;
        }
        #status {
            margin-top: 2em;
            background-color: #1c1c1c;
            padding: 1em;
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            font-size: 0.95em;
            white-space: pre-wrap;
        }
    </style>

<link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(function(reg) {
      console.log("Service Worker 注册成功:", reg.scope);
    }).catch(function(error) {
      console.log("Service Worker 注册失败:", error);
    });
}
</script>
</head>
<body>
    <h1>发送到频道：收藏</h1>
    <textarea id="message" placeholder="请输入消息内容..."></textarea>
    <button id="sendBtn">发送</button>
    <div id="status">状态将在此显示</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("sendBtn").addEventListener("click", send);
        });

        function send() {
            const message = document.getElementById("message").value.trim();
            const status = document.getElementById("status");
            status.textContent = "准备发送...\n";

            if (!message) {
                status.textContent += "请输入消息内容";
                return;
            }

            const url = "https://api.telegram.org/bot7766527131:AAGNQaNLtyrjVXjDcrqc1jYfopcy3xcd09w/sendMessage";
            const payload = {
                chat_id: "-1002592111685",
                text: message
            };

            status.textContent += "请求地址: " + url + "\n";
            status.textContent += "请求体: " + JSON.stringify(payload, null, 2) + "\n";

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                status.textContent += "\n响应：\n" + JSON.stringify(data, null, 2);
            })
            .catch(err => {
                status.textContent += "\n出错：\n" + err;
            });
        }
    </script>
</body>
</html>
