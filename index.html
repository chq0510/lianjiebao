    if ('serviceWorker' in navigator) {

// 显示所选文件名
document.getElementById("image").addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    document.getElementById("filenameLabel").textContent = "已选图片：" + file.name;
  }
});
document.getElementById("document").addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    document.getElementById("filenameLabel").textContent = "已选文件：" + file.name;
  }
});

function handleFileChange(type) {
  const fileInput = document.getElementById(type);
  const file = fileInput.files[0];
  if (file) {
    document.getElementById("filenameLabel").textContent = "已选" + (type === "image" ? "图片：" : "文件：") + file.name;
  }
}

document.querySelector("label[for='image']").addEventListener("click", function() {
  document.getElementById("image").click();
});
document.querySelector("label[for='document']").addEventListener("click", function() {
  document.getElementById("document").click();
});

function clearFields() {
  document.getElementById("msg").value = "";
  document.getElementById("image").value = "";
  document.getElementById("document").value = "";
  document.getElementById("filenameLabel").textContent = "未选择任何文件";
}

// 插入预览确认逻辑（发送前弹窗确认）


function doSend() {
  const msg = document.getElementById("msg").value;
  const status = document.getElementById("status");
  const bar = document.getElementById("progressBar");
  status.textContent = "发送中...";
  bar.style.display = "block";
  bar.style.width = "20%";
  setTimeout(() => bar.style.width = "80%", 300);

  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `chat_id=${encodeURIComponent(chat_id)}&parse_mode=MarkdownV2&text=${encodeURIComponent(msg)}`
  })
  .then(res => res.json())
  .then(data => {
    bar.style.display = "none";
    console.log("Telegram 响应：", data);
    if (data.ok) {
      status.textContent = "✅ 发送成功";
      showCelebration();
      clearFields();
    } else {
      status.textContent = "❌ 发送失败：" + data.description;
    }
  })
  .catch(err => {
    bar.style.display = "none";
    status.textContent = "❌ 请求出错：" + err;
    console.error("请求出错：", err);
  });
}

  const text = document.getElementById("msg").value;
  const imageFile = document.getElementById("image").files[0];
  const docFile = document.getElementById("document").files[0];
  let preview = "";
  if (text) preview += `【文字】\n${text}\n\n`;
  if (imageFile) preview += `【图片】${imageFile.name}\n`;
  if (docFile) preview += `【文件】${docFile.name}\n`;

  if (!preview) {
    alert("没有填写任何内容！");
    return;
  }

  const confirmSend = confirm("请确认发送以下内容：\n\n" + preview);
  if (confirmSend) {
    doSend();
  }
};
</script>

// 庆祝动画（简单彩带效果）
function showCelebration() {
  const confetti = document.createElement("div");
  confetti.textContent = "🎉";
  confetti.style.position = "fixed";
  confetti.style.fontSize = "40px";
  confetti.style.left = Math.random() * 90 + "%";
  confetti.style.top = "10px";
  confetti.style.animation = "fall 1s ease-out forwards";
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 1000);
}

@keyframes fall {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(200px); opacity: 0; }
}
